services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alpaca
      POSTGRES_USER: alpaca
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  pgdata:
